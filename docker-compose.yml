version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bankflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bankflow_ai
      POSTGRES_MULTIPLE_DATABASES: "bankflow_ai_blr,bankflow_ai_che,bankflow_ai_hyd,bankflow_ai_test,bankflow_ai_test_blr,bankflow_ai_test_che,bankflow_ai_test_hyd"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bankflow-net

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: bankflow-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management Web UI & HTTP API
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bankflow-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bankflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=bankflow_ai
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - ENVIRONMENT=production
      - FEDERATION_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - bankflow-net

  agent-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: bankflow-agent-worker
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=bankflow_ai
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bankflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bankflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bankflow-net

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  bankflow-net:
    driver: bridge
